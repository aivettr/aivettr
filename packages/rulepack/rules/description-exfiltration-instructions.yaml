id: description/exfiltration-instructions
meta:
  title: 工具描述指示模型外发对话/数据
  description: 工具描述指示模型把对话历史、消息、上下文或用户数据发送/转发到外部地址（含 BCC 密送），是描述投毒驱动数据外泄（LLM08）的直接信号。
  severity: critical
  owasp:
    - LLM01:2026
    - LLM08:2026
match:
  scope: descriptions
  flags: gi
  message: 工具描述含外发对话/用户数据到外部地址的隐藏指令
  regex: '\b(?:send|post|forward|upload|email|exfiltrate|transmit|bcc|cc)\b[^.\n]{0,100}?\b(?:(?:all|the|full|entire|every|each|any|this|your|user)\s+(?:conversation|chat|history|context|messages?|data|contents?|details?|instructions?|prompts?)|conversation(?:\s+history)?|chat\s+history|history|context|user\s+data|user\s+data\s+\w+|contents?|details?|instructions?|prompts?)\b[^.\n]{0,100}?\b(?:to|https?://|@)\b'
