id: supplychain/install-scripts
meta:
  title: package.json 声明安装期脚本
  description: preinstall/install/postinstall 在 npm 安装阶段自动执行，是投毒包最常用的持久化/投递入口；MCP server 包通常无需安装期脚本，出现时应人工核对。
  severity: medium
  owasp:
    - LLM04:2026
match:
  scope: manifest
  message: package.json 声明安装期自动执行脚本（供应链高风险面）
  fields:
    - path: scripts.preinstall
      exists: true
    - path: scripts.install
      exists: true
    - path: scripts.postinstall
      exists: true
